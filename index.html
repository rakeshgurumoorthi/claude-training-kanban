<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC IT PMO — Kanban Board</title>
<style>
  /* =========================================================
     Design tokens: palette, spacing, type
     ========================================================= */
  :root {
    --blue-900: #0b2545;
    --blue-800: #13315c;
    --blue-700: #1b4b8a;
    --blue-600: #1f5fae;
    --blue-500: #2d74d6;
    --blue-100: #dce8f8;
    --blue-50:  #f1f6fd;

    --grey-900: #1d2330;
    --grey-700: #4a5263;
    --grey-500: #7a8396;
    --grey-300: #c9cfda;
    --grey-200: #e2e6ee;
    --grey-100: #eef1f6;
    --white:    #ffffff;

    --critical: #c62828;
    --critical-bg: #fde8e8;
    --high:     #c77700;
    --high-bg:  #fff2db;
    --medium:   var(--blue-600);
    --medium-bg: var(--blue-100);
    --low:      #6b7280;
    --low-bg:   #eceef2;

    --success:  #1e7b45;
    --warning:  #9a5b00;
    --focus:    #f5b700;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --radius: 8px;
    --radius-sm: 4px;
    --shadow-sm: 0 1px 2px rgba(11, 37, 69, 0.08);
    --shadow-md: 0 4px 14px rgba(11, 37, 69, 0.14);

    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  /* =========================================================
     Base
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.4;
    color: var(--grey-900);
    background: var(--grey-100);
  }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  button { cursor: pointer; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    padding: var(--space-2) var(--space-4);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font-weight: 600;
    background: var(--white);
  }
  .btn-primary { background: var(--blue-600); color: var(--white); }
  .btn-primary:hover { background: var(--blue-700); }
  .btn-primary:disabled { background: var(--grey-500); cursor: progress; }
  .btn-secondary { border-color: var(--grey-300); color: var(--blue-800); }
  .btn-secondary:hover { background: var(--blue-50); }
  .btn-header { background: var(--white); color: var(--blue-800); }
  .btn-header:hover { background: var(--blue-100); }

  /* =========================================================
     Header: wordmark, summary strip, actions
     ========================================================= */
  .app-header {
    background: var(--blue-800);
    color: var(--white);
    padding: var(--space-4) var(--space-5);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-4) var(--space-6);
  }

  .wordmark {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .wordmark span { font-weight: 400; opacity: 0.8; }

  .demo-note {
    margin: var(--space-1) 0 0;
    font-size: 0.78rem;
    opacity: 0.8;
  }

  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin: 0;
    padding: 0;
    list-style: none;
    flex: 1;
  }
  .summary li {
    background: rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-sm);
    padding: var(--space-1) var(--space-3);
    font-size: 0.82rem;
  }
  .summary strong { font-size: 1rem; margin-right: var(--space-1); }
  .summary .summary-overdue strong { color: #ffb4b4; }

  /* =========================================================
     Filter bar
     ========================================================= */
  main { padding: var(--space-5); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--space-3) var(--space-4);
    background: var(--white);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    margin-bottom: var(--space-5);
  }
  .filters h2 { margin: 0 var(--space-2) var(--space-2) 0; font-size: 0.95rem; color: var(--blue-800); }
  .filter-field { display: flex; flex-direction: column; gap: var(--space-1); }
  .filter-field label { font-size: 0.78rem; font-weight: 600; color: var(--grey-700); }
  .filter-field select,
  .filter-field input {
    min-width: 180px;
    padding: var(--space-2);
    border: 1px solid var(--grey-300);
    border-radius: var(--radius-sm);
    background: var(--white);
  }
  .filter-result { margin-left: auto; font-size: 0.82rem; color: var(--grey-700); align-self: center; }

  /* =========================================================
     Board & columns
     ========================================================= */
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
    align-items: start;
  }

  .column {
    background: var(--grey-200);
    border-radius: var(--radius);
    padding: var(--space-3);
    min-height: 240px;
    border: 2px dashed transparent;
    transition: background 120ms, border-color 120ms;
  }
  .column.drop-target {
    background: var(--blue-100);
    border-color: var(--blue-500);
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-3);
    padding-bottom: var(--space-2);
    border-bottom: 3px solid var(--col-accent, var(--blue-600));
  }
  .column-header h2 { margin: 0; font-size: 1rem; color: var(--blue-900); }
  .column[data-status="Backlog"]     { --col-accent: var(--grey-500); }
  .column[data-status="In Progress"] { --col-accent: var(--blue-600); }
  .column[data-status="Blocked"]     { --col-accent: var(--critical); }
  .column[data-status="Done"]        { --col-accent: var(--success); }

  .count-badge {
    min-width: 28px;
    text-align: center;
    padding: 2px var(--space-2);
    border-radius: 999px;
    background: var(--blue-900);
    color: var(--white);
    font-size: 0.8rem;
    font-weight: 700;
  }

  .card-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    min-height: 80px;
  }
  .empty-col {
    color: var(--grey-500);
    font-size: 0.85rem;
    text-align: center;
    padding: var(--space-5) var(--space-2);
  }

  /* =========================================================
     Cards
     ========================================================= */
  .card {
    position: relative;
    background: var(--white);
    border-radius: var(--radius-sm);
    border-left: 6px solid var(--prio, var(--medium));
    box-shadow: var(--shadow-sm);
    padding: var(--space-3);
    cursor: grab;
  }
  .card:hover { box-shadow: var(--shadow-md); }
  .card.dragging { opacity: 0.45; }
  .card[data-priority="Critical"] { --prio: var(--critical); --prio-bg: var(--critical-bg); }
  .card[data-priority="High"]     { --prio: var(--high);     --prio-bg: var(--high-bg); }
  .card[data-priority="Medium"]   { --prio: var(--medium);   --prio-bg: var(--medium-bg); }
  .card[data-priority="Low"]      { --prio: var(--low);      --prio-bg: var(--low-bg); }

  .card-top {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-1);
  }
  .task-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--grey-700); }
  .card-title { margin: 0 0 var(--space-2); font-size: 0.95rem; font-weight: 650; overflow-wrap: anywhere; }
  .card-desc { margin: 0 0 var(--space-2); font-size: 0.82rem; color: var(--grey-700); overflow-wrap: anywhere; }

  .card-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px var(--space-2);
    margin: 0 0 var(--space-2);
    font-size: 0.8rem;
  }
  .card-meta dt { color: var(--grey-500); }
  .card-meta dd { margin: 0; overflow-wrap: anywhere; }

  .card-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); }

  .pill, .tag, .overdue-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px var(--space-2);
    border-radius: 999px;
  }
  .pill { color: var(--prio); background: var(--prio-bg); border: 1px solid var(--prio); }
  .tag { background: var(--blue-50); color: var(--blue-800); border: 1px solid var(--blue-100); font-weight: 600; }
  .overdue-badge { background: var(--critical-bg); color: var(--critical); }

  .icon-btn {
    margin-left: auto;
    border: none;
    background: transparent;
    width: 26px; height: 26px;
    border-radius: var(--radius-sm);
    font-size: 1.1rem;
    line-height: 1;
    color: var(--grey-500);
  }
  .icon-btn:hover { background: var(--critical-bg); color: var(--critical); }

  .card-actions {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-top: var(--space-3);
    flex-wrap: wrap;
  }
  .mini-btn {
    border: 1px solid var(--grey-300);
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 2px var(--space-2);
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--blue-800);
  }
  .mini-btn:hover { background: var(--blue-50); }
  .mini-btn.danger { border-color: var(--critical); color: var(--white); background: var(--critical); }

  .move-menu {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    margin-top: var(--space-2);
    padding: var(--space-2);
    background: var(--blue-50);
    border-radius: var(--radius-sm);
  }
  .move-menu span { width: 100%; font-size: 0.75rem; color: var(--grey-700); }

  .confirm-delete {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-top: var(--space-2);
    padding: var(--space-2);
    background: var(--critical-bg);
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--critical);
  }

  /* =========================================================
     Add Task modal
     ========================================================= */
  dialog {
    width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    padding: 0;
    border: none;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
  }
  dialog::backdrop { background: rgba(11, 37, 69, 0.55); }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-4) var(--space-5);
    background: var(--blue-800);
    color: var(--white);
  }
  .modal-head h2 { margin: 0; font-size: 1.1rem; }
  .modal-head .icon-btn { color: var(--white); margin-left: 0; }
  .modal-head .icon-btn:hover { background: rgba(255, 255, 255, 0.15); color: var(--white); }

  .task-form { padding: var(--space-5); }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3) var(--space-4);
  }
  .form-field { display: flex; flex-direction: column; gap: var(--space-1); }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-weight: 600; font-size: 0.85rem; color: var(--blue-900); }
  .form-field .req { color: var(--critical); }
  .form-field input,
  .form-field select,
  .form-field textarea {
    padding: var(--space-2);
    border: 1px solid var(--grey-300);
    border-radius: var(--radius-sm);
    background: var(--white);
  }
  .form-field textarea { resize: vertical; min-height: 80px; }
  .form-field [aria-invalid="true"] { border-color: var(--critical); background: #fffafa; }
  .field-hint { font-size: 0.75rem; color: var(--grey-500); text-align: right; }
  .error { margin: 0; min-height: 1em; font-size: 0.78rem; color: var(--critical); }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-3);
    margin-top: var(--space-5);
  }

  /* =========================================================
     Toasts
     ========================================================= */
  .toast-region {
    position: fixed;
    right: var(--space-4);
    bottom: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    z-index: 100;
    max-width: min(380px, calc(100vw - 32px));
  }
  .toast {
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    color: var(--white);
    background: var(--blue-800);
    font-size: 0.88rem;
    animation: toast-in 180ms ease-out;
  }
  .toast.success { background: var(--success); }
  .toast.warning { background: var(--warning); }
  @keyframes toast-in {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { animation: none; }
    .column { transition: none; }
  }

  /* =========================================================
     Responsive: stack columns below 768px
     ========================================================= */
  @media (max-width: 1100px) and (min-width: 768px) {
    .card-meta { grid-template-columns: 1fr; }
  }
  @media (max-width: 767px) {
    .app-header { padding: var(--space-4); }
    main { padding: var(--space-4); }
    .board { grid-template-columns: 1fr; }
    .column { min-height: 0; }
    .form-grid { grid-template-columns: 1fr; }
    .filter-field, .filter-field select, .filter-field input { width: 100%; min-width: 0; }
    .filter-result { margin-left: 0; }
  }
</style>
</head>
<body>

<!-- =========================================================
     Header
     ========================================================= -->
<header class="app-header">
  <div>
    <h1 class="wordmark">ABC IT PMO <span>Kanban</span></h1>
    <p class="demo-note">Demo data · changes live in memory only and reset when you refresh the page.</p>
  </div>

  <ul class="summary" id="summary" aria-label="Board summary">
    <!-- populated by renderSummary() -->
  </ul>

  <button type="button" class="btn btn-header" id="openAddTask">+ Add Task</button>
</header>

<main>
  <!-- =========================================================
       Filter bar
       ========================================================= -->
  <section class="filters" aria-labelledby="filtersHeading">
    <h2 id="filtersHeading">Filters</h2>
    <div class="filter-field">
      <label for="filterProject">Project</label>
      <select id="filterProject"></select>
    </div>
    <div class="filter-field">
      <label for="filterAssignee">Assignee contains</label>
      <input type="search" id="filterAssignee" placeholder="e.g. Tan" autocomplete="off">
    </div>
    <div class="filter-field">
      <label for="filterPriority">Priority</label>
      <select id="filterPriority"></select>
    </div>
    <button type="button" class="btn btn-secondary" id="clearFilters">Clear filters</button>
    <p class="filter-result" id="filterResult" aria-live="polite"></p>
  </section>

  <!-- =========================================================
       Kanban board (columns generated from STATUSES)
       ========================================================= -->
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- =========================================================
     Add Task modal
     ========================================================= -->
<dialog id="taskDialog" aria-labelledby="taskDialogTitle">
  <div class="modal-head">
    <h2 id="taskDialogTitle">Add Task</h2>
    <button type="button" class="icon-btn" id="closeDialog" aria-label="Close add task form">&times;</button>
  </div>

  <form class="task-form" id="taskForm" novalidate>
    <div class="form-grid">
      <div class="form-field full">
        <label for="fTitle">Task Title <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="fTitle" name="title" maxlength="80" required aria-describedby="fTitleErr fTitleCount">
        <span class="field-hint" id="fTitleCount">0 / 80</span>
        <p class="error" id="fTitleErr"></p>
      </div>

      <div class="form-field full">
        <label for="fDescription">Description</label>
        <textarea id="fDescription" name="description" maxlength="500" aria-describedby="fDescriptionErr fDescriptionCount"></textarea>
        <span class="field-hint" id="fDescriptionCount">0 / 500</span>
        <p class="error" id="fDescriptionErr"></p>
      </div>

      <div class="form-field">
        <label for="fProject">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
        <select id="fProject" name="project" required aria-describedby="fProjectErr"></select>
        <p class="error" id="fProjectErr"></p>
      </div>

      <div class="form-field">
        <label for="fCategory">Category <span class="req" aria-hidden="true">*</span></label>
        <select id="fCategory" name="category" required aria-describedby="fCategoryErr"></select>
        <p class="error" id="fCategoryErr"></p>
      </div>

      <div class="form-field">
        <label for="fAssignee">Assignee <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="fAssignee" name="assignee" required maxlength="60" autocomplete="off" aria-describedby="fAssigneeErr">
        <p class="error" id="fAssigneeErr"></p>
      </div>

      <div class="form-field">
        <label for="fPriority">Priority</label>
        <select id="fPriority" name="priority" aria-describedby="fPriorityErr"></select>
        <p class="error" id="fPriorityErr"></p>
      </div>

      <div class="form-field">
        <label for="fDueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
        <input type="date" id="fDueDate" name="dueDate" required aria-describedby="fDueDateErr">
        <p class="error" id="fDueDateErr"></p>
      </div>

      <div class="form-field">
        <label for="fStatus">Status</label>
        <select id="fStatus" name="status" aria-describedby="fStatusErr"></select>
        <p class="error" id="fStatusErr"></p>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" id="cancelDialog">Cancel</button>
      <button type="submit" class="btn btn-primary" id="submitTask">Add Task</button>
    </div>
  </form>
</dialog>

<!-- Toast notifications (announced politely to screen readers) -->
<div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="false"></div>

<!--
  =====================================================================
  FORMSUBMIT CONFIG — read before use
  ---------------------------------------------------------------------
  FORMSUBMIT_ENDPOINT (top of the script below) holds the destination
  email address. Replace YOUR_EMAIL@example.com with the PMO inbox.

  FormSubmit needs a ONE-TIME ACTIVATION per address: the very first
  submission does not deliver — instead FormSubmit emails a confirmation
  link to that address. Nothing is delivered until someone clicks the
  link in that email. After activation, every new task is emailed.
  =====================================================================
-->
<script>
"use strict";

/* =========================================================
   CONFIG — change the email address here, and only here
   ========================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const FORMSUBMIT_PLACEHOLDER = "YOUR_EMAIL@example.com";

const ID_PREFIX = "ABC-ITPM-";
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINTS = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on a dependency, vendor or approval",
  "Done": "Completed / closed",
};
const PROJECTS = [
  "Core Banking Upgrade",
  "Digital Channels",
  "Cybersecurity Uplift",
  "Data & Analytics",
  "Infrastructure & Cloud",
  "Vendor Management",
];
const CATEGORIES = [
  "Application Development",
  "Infrastructure",
  "Cybersecurity",
  "Data",
  "Compliance",
  "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const TOAST_MS = 4500;

/* =========================================================
   STATE — single source of truth; the DOM is rendered from it
   ========================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextId: 1,
  pendingDeleteId: null, // card currently showing "Delete? Yes / No"
  openMoveId: null,      // card currently showing the Move menu
  focusAfterRender: null // CSS selector to focus after the next render
};

/* =========================================================
   HELPERS
   ========================================================= */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatId(n) {
  return ID_PREFIX + String(n).padStart(4, "0");
}

function toISODate(date) {
  // Local calendar date (not UTC) so "today" matches the user's clock.
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function todayISO() {
  return toISODate(new Date());
}

function daysFromToday(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return toISODate(d);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-GB", {
    day: "2-digit", month: "short", year: "numeric",
  });
}

function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function optionsHtml(values, selected, allLabel) {
  const all = allLabel ? `<option value="">${escapeHtml(allLabel)}</option>` : "";
  return all + values
    .map(v => `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`)
    .join("");
}

function findTask(id) {
  return state.tasks.find(t => t.id === id);
}

/* =========================================================
   SEED DATA — 8 demo tasks, due dates relative to today
   ========================================================= */
function seedTasks() {
  const seed = [

    { title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Roll out vendor hotfix to the teller VDI golden image and redeploy to all branches.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Lim Wei Jie", priority: "Critical", due: 2, status: "In Progress" },

/* =========================================================
   RENDERING
   ========================================================= */

// Build the four empty column shells once; renderBoard() fills them.
function buildColumns() {
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map(status => {
    const id = slug(status);
    return `
      <section class="column" data-status="${escapeHtml(status)}" aria-labelledby="col-${id}-title">
        <div class="column-header">
          <h2 id="col-${id}-title" title="${escapeHtml(STATUS_HINTS[status])}">${escapeHtml(status)}</h2>
          <span class="count-badge" id="col-${id}-count" aria-label="0 tasks">0</span>
        </div>
        <ul class="card-list" id="col-${id}-list"></ul>
      </section>`;
  }).join("");
}

function getFilteredTasks() {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return state.tasks.filter(t =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

function renderCard(task) {
  const id = escapeHtml(task.id);
  const overdue = isOverdue(task);
  const moveOpen = state.openMoveId === task.id;
  const confirming = state.pendingDeleteId === task.id;

  const moveMenu = moveOpen ? `
    <div class="move-menu" role="group" aria-label="Move ${id} to column">
      <span>Move to:</span>
      ${STATUSES.filter(s => s !== task.status).map(s =>
        `<button type="button" class="mini-btn" data-action="move-to" data-id="${id}" data-status="${escapeHtml(s)}">${escapeHtml(s)}</button>`
      ).join("")}
      <button type="button" class="mini-btn" data-action="move-cancel" data-id="${id}">Cancel</button>
    </div>` : "";

  const confirmBox = confirming ? `
    <div class="confirm-delete" role="group" aria-label="Confirm delete ${id}">
      Delete?
      <button type="button" class="mini-btn danger" data-action="delete-yes" data-id="${id}">Yes</button>
      <button type="button" class="mini-btn" data-action="delete-no" data-id="${id}">No</button>
    </div>` : "";

  return `
    <li class="card" draggable="true" data-id="${id}" data-priority="${escapeHtml(task.priority)}" aria-label="${id}: ${escapeHtml(task.title)}">
      <div class="card-top">
        <span class="task-id">${id}</span>
        ${overdue ? `<span class="overdue-badge">Overdue</span>` : ""}
        <button type="button" class="icon-btn" data-action="delete" data-id="${id}" aria-label="Delete task ${id}">&times;</button>
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      ${task.description ? `<p class="card-desc">${escapeHtml(task.description)}</p>` : ""}
      <dl class="card-meta">
        <dt>Project</dt><dd>${escapeHtml(task.project)}</dd>
        <dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd>
        <dt>Due</dt><dd><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd>
      </dl>
      <div class="card-tags">
        <span class="pill">${escapeHtml(task.priority)}</span>
        <span class="tag">${escapeHtml(task.category)}</span>
      </div>
      <div class="card-actions">
        <button type="button" class="mini-btn" data-action="move" data-id="${id}" aria-expanded="${moveOpen}">Move &#9656;</button>
      </div>
      ${moveMenu}
      ${confirmBox}
    </li>`;
}

function renderSummary() {
  const counts = Object.fromEntries(STATUSES.map(s => [s, 0]));
  let overdue = 0;
  for (const t of state.tasks) {
    counts[t.status]++;
    if (isOverdue(t)) overdue++;
  }
  const items = [
    ["Total", state.tasks.length],
    ...STATUSES.map(s => [s, counts[s]]),
  ];
  document.getElementById("summary").innerHTML =
    items.map(([label, n]) => `<li><strong>${n}</strong>${escapeHtml(label)}</li>`).join("") +
    `<li class="summary-overdue"><strong>${overdue}</strong>Overdue</li>`;
}

function renderBoard() {
  const visible = getFilteredTasks();

  for (const status of STATUSES) {
    const id = slug(status);
    const tasks = visible.filter(t => t.status === status);
    const list = document.getElementById(`col-${id}-list`);
    list.innerHTML = tasks.length
      ? tasks.map(renderCard).join("")
      : `<li class="empty-col">No tasks</li>`;
    const badge = document.getElementById(`col-${id}-count`);
    badge.textContent = tasks.length;
    badge.setAttribute("aria-label", `${tasks.length} task${tasks.length === 1 ? "" : "s"}`);
  }

  const filtered = visible.length !== state.tasks.length;
  document.getElementById("filterResult").textContent =
    filtered ? `Showing ${visible.length} of ${state.tasks.length} tasks` : "";

  renderSummary();

  if (state.focusAfterRender) {
    const el = document.querySelector(state.focusAfterRender);
    if (el) el.focus();
    state.focusAfterRender = null;
  }
}

/* =========================================================
   STATE MUTATIONS — each one updates state then re-renders
   ========================================================= */
function addTask(data) {
  const task = { id: formatId(state.nextId++), ...data };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, status) {
  const task = findTask(id);
  if (!task || !STATUSES.includes(status) || task.status === status) return;
  task.status = status;
  state.openMoveId = null;
  state.pendingDeleteId = null;
  renderBoard();
  showToast(`${task.id} moved to ${status}.`, "info");
}

function deleteTask(id) {
  const task = findTask(id);
  state.tasks = state.tasks.filter(t => t.id !== id);
  state.pendingDeleteId = null;
  if (state.openMoveId === id) state.openMoveId = null;
  state.focusAfterRender = "#openAddTask";
  renderBoard();
  if (task) showToast(`${task.id} deleted.`, "info");
}

function applyFilters() {
  state.filters = {
    project: document.getElementById("filterProject").value,
    assignee: document.getElementById("filterAssignee").value,
    priority: document.getElementById("filterPriority").value,
  };
  renderBoard();
}

/* =========================================================
   TOASTS
   ========================================================= */
function showToast(message, type = "info") {
  const region = document.getElementById("toastRegion");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.setAttribute("role", type === "warning" ? "alert" : "status");
  toast.textContent = message;
  region.appendChild(toast);
  setTimeout(() => toast.remove(), TOAST_MS);
}

/* =========================================================
   FORMSUBMIT — email notification for new tasks
   ========================================================= */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[ABC IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString(),
    }),
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* =========================================================
   ADD TASK FORM — validation, submit, modal
   ========================================================= */
const FIELD_IDS = {
  title: "fTitle",
  description: "fDescription",
  project: "fProject",
  category: "fCategory",
  assignee: "fAssignee",
  priority: "fPriority",
  dueDate: "fDueDate",
  status: "fStatus",
};

function readForm() {
  const val = key => document.getElementById(FIELD_IDS[key]).value;
  return {
    title: val("title").trim(),
    description: val("description").trim(),
    project: val("project"),
    category: val("category"),
    assignee: val("assignee").trim(),
    priority: val("priority"),
    dueDate: val("dueDate"),
    status: val("status"),
  };
}

function validateForm(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project / workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";
  if (!STATUSES.includes(data.status)) errors.status = "Choose a status.";

  let firstInvalid = null;
  for (const [key, id] of Object.entries(FIELD_IDS)) {
    const input = document.getElementById(id);
    const msg = errors[key] || "";
    document.getElementById(`${id}Err`).textContent = msg;
    input.setAttribute("aria-invalid", msg ? "true" : "false");
    if (msg && !firstInvalid) firstInvalid = input;
  }
  if (firstInvalid) firstInvalid.focus();
  return !firstInvalid;
}

function clearFormErrors() {
  for (const id of Object.values(FIELD_IDS)) {
    document.getElementById(`${id}Err`).textContent = "";
    document.getElementById(id).setAttribute("aria-invalid", "false");
  }
}

function resetForm() {
  const form = document.getElementById("taskForm");
  form.reset();
  document.getElementById("fPriority").value = "Medium";
  document.getElementById("fStatus").value = "Backlog";
  document.getElementById("fDueDate").min = todayISO();
  updateCharCounts();
  clearFormErrors();
}

function updateCharCounts() {
  document.getElementById("fTitleCount").textContent =
    `${document.getElementById("fTitle").value.length} / 80`;
  document.getElementById("fDescriptionCount").textContent =
    `${document.getElementById("fDescription").value.length} / 500`;
}

function setSending(sending) {
  const btn = document.getElementById("submitTask");
  btn.disabled = sending;
  btn.textContent = sending ? "Sending…" : "Add Task";
}

function openModal() {
  resetForm();
  document.getElementById("taskDialog").showModal();
  document.getElementById("fTitle").focus();
}

function closeModal() {
  const dialog = document.getElementById("taskDialog");
  if (dialog.open) dialog.close();
}

async function handleSubmit(event) {
  event.preventDefault();
  if (document.getElementById("submitTask").disabled) return;

  const data = readForm();
  if (!validateForm(data)) return;

  // Optimistic UI: card appears immediately, email goes out in parallel.
  const task = addTask(data);
  resetForm();
  showToast(`${task.id} added to ${task.status}.`, "success");

  setSending(true);
  try {
    if (FORMSUBMIT_ENDPOINT.includes(FORMSUBMIT_PLACEHOLDER)) {
      throw new Error("FormSubmit endpoint not configured");
    }
    await notifyNewTask(task);
    showToast(`Email notification sent for ${task.id}.`, "info");
  } catch (err) {
    console.warn(err);
    showToast("Card added locally — email notification failed", "warning");
  } finally {
    setSending(false);
    closeModal();
  }
}

/* =========================================================
   DRAG & DROP (native HTML5 API, delegated on the board)
   ========================================================= */
function wireDragAndDrop() {
  const board = document.getElementById("board");

  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });

  board.addEventListener("dragend", e => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    board.querySelectorAll(".drop-target").forEach(c => c.classList.remove("drop-target"));
  });

  board.addEventListener("dragover", e => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    column.classList.add("drop-target");
  });

  board.addEventListener("dragleave", e => {
    const column = e.target.closest(".column");
    if (column && !column.contains(e.relatedTarget)) column.classList.remove("drop-target");
  });

  board.addEventListener("drop", e => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    column.classList.remove("drop-target");
    const id = e.dataTransfer.getData("text/plain");
    if (id) moveTask(id, column.dataset.status);
  });
}

/* =========================================================
   CARD BUTTONS — Move menu & inline delete confirm (delegated)
   ========================================================= */
function wireCardActions() {
  const board = document.getElementById("board");

  board.addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const sel = action => `.card[data-id="${CSS.escape(id)}"] [data-action="${action}"]`;

    switch (btn.dataset.action) {
      case "move":
        state.openMoveId = state.openMoveId === id ? null : id;
        state.pendingDeleteId = null;
        state.focusAfterRender = state.openMoveId ? `${sel("move-to")}` : sel("move");
        renderBoard();
        break;
      case "move-to":
        state.focusAfterRender = sel("move");
        moveTask(id, btn.dataset.status);
        break;
      case "move-cancel":
        state.openMoveId = null;
        state.focusAfterRender = sel("move");
        renderBoard();
        break;
      case "delete":
        state.pendingDeleteId = id;
        state.openMoveId = null;
        state.focusAfterRender = sel("delete-no");
        renderBoard();
        break;
      case "delete-yes":
        deleteTask(id);
        break;
      case "delete-no":
        state.pendingDeleteId = null;
        state.focusAfterRender = sel("delete");
        renderBoard();
        break;
    }
  });

  // Escape closes an open Move menu or delete confirmation.
  board.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    const card = e.target.closest(".card");
    if (!card || (!state.openMoveId && !state.pendingDeleteId)) return;
    const id = card.dataset.id;
    const action = state.openMoveId === id ? "move" : "delete";
    state.openMoveId = null;
    state.pendingDeleteId = null;
    state.focusAfterRender = `.card[data-id="${CSS.escape(id)}"] [data-action="${action}"]`;
    renderBoard();
  });
}

/* =========================================================
   INIT
   ========================================================= */
function populateSelects() {
  document.getElementById("filterProject").innerHTML = optionsHtml(PROJECTS, "", "All projects");
  document.getElementById("filterPriority").innerHTML = optionsHtml(PRIORITIES, "", "All priorities");
  document.getElementById("fProject").innerHTML = optionsHtml(PROJECTS, "", "Select a project…");
  document.getElementById("fCategory").innerHTML = optionsHtml(CATEGORIES, "", "Select a category…");
  document.getElementById("fPriority").innerHTML = optionsHtml(PRIORITIES, "Medium");
  document.getElementById("fStatus").innerHTML = optionsHtml(STATUSES, "Backlog");
}

function wireControls() {
  document.getElementById("openAddTask").addEventListener("click", openModal);
  document.getElementById("closeDialog").addEventListener("click", closeModal);
  document.getElementById("cancelDialog").addEventListener("click", closeModal);
  document.getElementById("taskForm").addEventListener("submit", handleSubmit);
  document.getElementById("fTitle").addEventListener("input", updateCharCounts);
  document.getElementById("fDescription").addEventListener("input", updateCharCounts);

  const dialog = document.getElementById("taskDialog");
  // Click on the backdrop (outside the dialog box) closes it.
  dialog.addEventListener("click", e => { if (e.target === dialog) closeModal(); });
  // Return focus to the opener when the dialog closes (Escape included).
  dialog.addEventListener("close", () => document.getElementById("openAddTask").focus());

  document.getElementById("filterProject").addEventListener("change", applyFilters);
  document.getElementById("filterPriority").addEventListener("change", applyFilters);
  document.getElementById("filterAssignee").addEventListener("input", applyFilters);
  document.getElementById("clearFilters").addEventListener("click", () => {
    document.getElementById("filterProject").value = "";
    document.getElementById("filterPriority").value = "";
    document.getElementById("filterAssignee").value = "";
    applyFilters();
  });
}

function init() {
  populateSelects();
  buildColumns();
  seedTasks();
  wireControls();
  wireDragAndDrop();
  wireCardActions();
  renderBoard();
}

init();
</script>
