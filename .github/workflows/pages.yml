name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project constraint check
        run: |
          if grep -nE "localStorage|sessionStorage|indexedDB|document\.cookie|alert\(|confirm\(|!important|<link|src=\"http" index.html v2/index.html; then
            echo "::error::Constraint check failed (see matches above)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the script block
        run: |
          python3 - <<'PY'
          import re, sys
          for src, out in [("index.html", "/tmp/app.js"), ("v2/index.html", "/tmp/app-v2.js")]:
              html = open(src, encoding="utf-8").read()
              blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
              if not blocks:
                  sys.exit(f"No <script> block found in {src}")
              open(out, "w", encoding="utf-8").write("\n".join(blocks))
          PY
          node --check /tmp/app.js
          node --check /tmp/app-v2.js

      - name: Secret scan
        run: |
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_|gho_|xox[baprs]-|sk-[A-Za-z0-9]{20,}|sk-ant-|AIza[0-9A-Za-z_-]{35}|(password|passwd|secret|api[_-]?key|token|client[_-]?secret)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{6,}'
          # The workflow, the publish command and the security-scanner agent are excluded because they contain the patterns.
          if git ls-files -z -- . ':!:.github/workflows/pages.yml' ':!:.claude/commands/publish-github.md' ':!:.claude/agents/security-scanner.md' | xargs -0 grep -nIE -- "$pattern"; then
            echo "::error::Possible secret found (see matches above)"
            exit 1
          fi

      - name: FormSubmit endpoint must hold the placeholder
        run: |
          for f in index.html v2/index.html; do
            if ! grep -E '^const FORMSUBMIT_ENDPOINT = ' "$f" | grep -q 'YOUR_EMAIL@example.com'; then
              echo "::error file=$f::FORMSUBMIT_ENDPOINT must contain YOUR_EMAIL@example.com, not a real address"
              exit 1
            fi
          done

  deploy:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        # v1 stays at the site root; v2 is published alongside it at /v2/.
        run: mkdir -p _site/v2 && cp index.html _site/ && cp v2/index.html _site/v2/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
