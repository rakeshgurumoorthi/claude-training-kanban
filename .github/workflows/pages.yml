name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project constraint check
        run: |
          if grep -nE "localStorage|sessionStorage|indexedDB|document\.cookie|alert\(|confirm\(|!important|<link|src=\"http" index.html; then
            echo "::error file=index.html::Constraint check failed (see matches above)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the script block
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not blocks:
              sys.exit("No <script> block found in index.html")
          open("/tmp/app.js", "w", encoding="utf-8").write("\n".join(blocks))
          PY
          node --check /tmp/app.js

      - name: Secret scan
        run: |
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_|gho_|xox[baprs]-|sk-[A-Za-z0-9]{20,}|sk-ant-|AIza[0-9A-Za-z_-]{35}|(password|passwd|secret|api[_-]?key|token|client[_-]?secret)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{6,}'
          # The workflow itself is excluded because it contains the patterns.
          if git ls-files -z -- . ':!:.github/workflows/pages.yml' | xargs -0 grep -nIE -- "$pattern"; then
            echo "::error::Possible secret found (see matches above)"
            exit 1
          fi

      - name: FormSubmit endpoint must hold the placeholder
        run: |
          if ! grep -E '^const FORMSUBMIT_ENDPOINT = ' index.html | grep -q 'YOUR_EMAIL@example.com'; then
            echo "::error file=index.html::FORMSUBMIT_ENDPOINT must contain YOUR_EMAIL@example.com, not a real address"
            exit 1
          fi

  deploy:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: mkdir _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
